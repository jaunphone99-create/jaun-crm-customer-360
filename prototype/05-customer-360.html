<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ข้อมูลลูกค้า (Customer 360) · JAUN CRM</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* หน้า 05 · Customer 360 (CANONICAL ข้อ 6.8 · 13.7 · sitemap-screen-specs ข้อ 8) — ไม่มี hex */
.c360-back { display: inline-flex; align-items: center; gap: var(--space-1); min-height: var(--touch-min); font-size: var(--fs-sm); color: var(--text-link); text-decoration: none; }
.c360-back svg { width: 16px; height: 16px; }
.c360-head { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-4); }
.c360-head__main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.c360-head__name { font-size: var(--fs-h2); }
.c360-head__actions { display: flex; align-items: center; gap: var(--space-2); }
.c360-menu { width: 280px; right: 0; }
.c360-layout { display: grid; gap: var(--space-4); grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
@media (min-width: 768px) and (max-width: 1279px) { .c360-layout { grid-template-columns: 280px minmax(0, 1fr); } }
@media (max-width: 767px) { .c360-layout { grid-template-columns: minmax(0, 1fr); } .c360-head { align-items: flex-start; } }
.c360-side { display: flex; flex-direction: column; gap: var(--space-4); }
.c360-side .contact-row, .c360-mbasic .contact-row { flex-wrap: wrap; }
.c360-side .contact-row__text { flex: 1 1 160px; }
.c360-side .contact-row__actions { flex: 1 1 100%; flex-wrap: wrap; padding-inline-start: 40px; margin-top: calc(-1 * var(--space-1)); }
.c360-side h2, .c360-block h3 { font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-heading); margin-bottom: var(--space-1); }
.c360-dl { display: flex; flex-direction: column; gap: var(--space-3); margin: 0; }
.c360-dl dt { font-size: var(--fs-xs); color: var(--text-secondary); }
.c360-dl dd { font-size: var(--fs-sm); margin: 0; color: var(--text-primary); }
.c360-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
.c360-tag { display: inline-flex; align-items: center; gap: 2px; }
.c360-tag button { border: 0; background: transparent; cursor: pointer; color: var(--text-secondary-sunk); min-width: 24px; min-height: 24px; border-radius: var(--radius-full); }
.c360-tag button:hover { background: var(--navy-100); }
.c360-stats { display: grid; gap: var(--space-3); grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1279px) { .c360-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.c360-stat { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 2px; }
.c360-stat__value { font-size: var(--fs-h2); font-weight: var(--fw-semibold); color: var(--text-heading); font-variant-numeric: tabular-nums; }
.c360-stat__value small { font-size: var(--fs-sm); font-weight: var(--fw-regular); color: var(--text-secondary); margin-inline-start: var(--space-1); }
.c360-stat__label { font-size: var(--fs-xs); color: var(--text-secondary); }
.c360-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-4) 0 var(--space-2); }
.c360-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1279px) { .c360-grid { grid-template-columns: minmax(0, 1fr); } }
.c360-block { min-width: 0; }
.c360-list { display: flex; flex-direction: column; }
.c360-item { display: flex; flex-direction: column; gap: 2px; padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
.c360-item:last-child { border-bottom: 0; }
.c360-item__head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.c360-item__title { font-size: var(--fs-sm); font-weight: var(--fw-medium); color: var(--text-heading); }
.c360-item__meta { font-size: var(--fs-xs); color: var(--text-secondary); }
.c360-item__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-1); }
.c360-section { margin-top: var(--space-5); }
.c360-section:first-child { margin-top: 0; }
.c360-section__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; border-bottom: 2px solid var(--border-default); padding-bottom: var(--space-2); margin-bottom: var(--space-1); }
.c360-section__head h3 { font-size: var(--fs-h4); font-weight: var(--fw-semibold); color: var(--text-heading); }
.c360-filters { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-end; margin-bottom: var(--space-3); }
.c360-filters .fieldset { max-width: 100%; }
.c360-filters .chip-option span { min-height: 36px; padding: 0 var(--space-3); font-size: var(--fs-xs); }
.c360-note { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-3); background: var(--surface-card); }
.c360-note[data-pinned="true"] { border-inline-start: 4px solid var(--support-blue); }
.c360-note + .c360-note { margin-top: var(--space-2); }
.c360-mactions { display: none; }
.c360-mbasic { display: none; }
@media (max-width: 767px) {
  .c360-mactions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); margin-bottom: var(--space-4); }
  .c360-mbasic { display: block; }
  .c360-toolbar .btn { flex: 1 1 auto; }
}
.c360-mactions .contact-row { display: block; min-height: 0; padding: 0; }
.c360-qbtn { width: 100%; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); background: var(--surface-card); color: var(--text-heading); font-size: var(--fs-xs); cursor: pointer; }
.c360-qbtn svg { width: 22px; height: 22px; color: var(--support-blue); }
.c360-qbtn[aria-disabled="true"] { color: var(--text-disabled); background: var(--surface-sunken); cursor: not-allowed; }
.c360-merge-table td, .c360-merge-table th { vertical-align: top; }
</style>
</head>
<body data-page="customer-360" data-roles="STAFF SUPERVISOR BRANCH_MANAGER OPERATIONS EXECUTIVE BUSINESS_ADMIN">
<div class="app" data-jcrm-app>
  <aside data-jcrm-sidebar></aside>
  <header data-jcrm-topbar></header>
  <main id="main" data-jcrm-main><div class="page" id="page"></div></main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* หน้า 05 · Customer 360 — api.get_customer_360 (เขียน CUSTOMER_VIEWED) · ค่าติดต่อปิดบังเสมอ (ข้อ 6.4 · D33) · task ไม่มี read-through (ข้อ 9.4)
   การแก้ไขทุกอย่างเป็นการจำลองในหน่วยความจำของหน้านี้ (prototype ไม่บันทึกจริง)
   หมายเหตุผู้เขียน
   1. ข้อ 13 ไม่พิมพ์สาขาของโน้ต (customer_notes.branch_id NOT NULL ตามข้อ 19.1) → ใช้สาขาแรกของลูกค้าในการตัดสิน note.update scope O
   2. ชื่อสินค้าของโอกาสขายที่ปิดการขายไม่มีคอลัมน์ในข้อ 13.7 → ดึงจากสรุปการติดต่อที่เวลาเดียวกับ won_at ("ปิดการขาย iPhone 16 128GB ฿28,900")
   3. dialog รวมลูกค้าเพิ่มขั้นเลือก survivor เพราะ api.merge_customers ต้องการ p_survivor_id (ข้อ 8.6 ของ sitemap-screen-specs ระบุ 3 ขั้นโดยไม่พูดถึงข้อนี้)
   4. ตัวเลือก "ผู้ดูแลใหม่" ตัด OPERATIONS ออก (บทบาทอ่านอย่างเดียว ข้อ 7) แม้จะมี assignment ในสาขา
   5. บทบาทที่ต้อง MFA ที่ยังเป็น aal1 ถูก JCRM.page ปฏิเสธทั้งหน้าเป็นการ์ด "ไม่มีสิทธิ์เข้าหน้านี้" พร้อมเหตุผล MFA แทน C-STATE-NOTFOUND + แถบ C-STATE-MFA (พฤติกรรมของชุดฐาน app.js) */
(function () {
  "use strict";
  var D = JCRM.data, fmt = JCRM.fmt, ui = JCRM.ui, esc = JCRM.esc, T = D.meta.texts;
  var DASH = fmt.DASH, NOW = D.meta.now;
  var OPEN_OPP = ["INTERESTED", "QUOTATION", "FOLLOW_UP"], OPEN_LEAD = ["NEW", "CONTACTED", "QUALIFIED"];
  var REASON_OWN_CUSTOMER = "แก้ได้เฉพาะลูกค้าที่คุณเป็นผู้ดูแล";
  var CONSENT_CHANNEL_LABEL = { LINE: "LINE", SMS: "SMS", PHONE: JCRM.label("channels", "PHONE"), EMAIL: "อีเมล" };
  var S = { no: null, tab: null, tlChannels: [], tlTypes: [], history: [], notes: null, consents: null, tags: null, revealToasted: false, mbasicOpen: false };
  var lastCtx = null;

  /* ---------- ข้อมูลลูกค้า ---------- */
  function cust() { return JCRM.customer(S.no); }
  function detail() { return D.customer360[S.no] || null; }
  function cctx() { return { customer: JCRM.customerCtx(S.no) }; }
  function reasonFor(perm, ctxObj) {
    var a = JCRM.access(perm, ctxObj || cctx());
    if (!a.visible || a.allowed) { return null; }
    return a.reason === T.reasonOwn ? REASON_OWN_CUSTOMER : a.reason;
  }
  function permBtn(o) { var c = {}; Object.keys(o).forEach(function (k) { c[k] = o[k]; }); if (!c.ctx) { c.ctx = cctx(); } c.reason = reasonFor(c.permission, c.ctx) || undefined; return ui.permButton(c); }
  function initState() {
    var d = detail();
    S.notes = d && d.pinnedNote ? [{ id: "n-1", body: d.pinnedNote.body, by: d.pinnedNote.by, at: d.pinnedNote.at, pinned: true, branch: d.firstBranch, fresh: false }] : [];
    S.consents = d ? d.consents.map(function (x) { var y = {}; Object.keys(x).forEach(function (k) { y[k] = x[k]; }); return y; }) : [];
    S.tags = d ? d.tags.slice() : [];
    S.history = [];
  }
  function ownerText(code) { return code ? JCRM.staffName(code) + " (" + code + ")" : DASH; }
  function oppsOf() { return D.opportunities.filter(function (o) { return o.customerNo === S.no; }); }
  function leadsOf() { return D.leads.filter(function (l) { return l.customerNo === S.no; }); }
  function quotesOf() { return D.quotations.filter(function (q) { return q.customerNo === S.no; }); }
  function tasksOf() { return D.tasks.filter(function (t) { return t.customerNo === S.no; }); }
  function productOfOpp(op) {
    if (op.items && op.items[0]) { return op.items[0].productModel; }
    /* WON ในข้อ 13.7 พิมพ์สินค้าไว้ในสรุปการติดต่อที่เวลาเดียวกับ won_at */
    var d = detail(), ix = d && op.wonAt ? JCRM.find(d.interactions, "occurredAt", op.wonAt) : null;
    return ix ? ix.summary.replace(/^ปิดการขาย\s*/, "").replace(/\s*฿[\d,.]+$/, "") : null;
  }
  function nextActions() {
    var out = [];
    oppsOf().forEach(function (o) { if (OPEN_OPP.indexOf(o.stage) !== -1 && o.nextAction) { out.push({ at: o.nextAction.at, title: o.nextAction.titleTh || JCRM.label("taskTypes", o.nextAction.type), owner: o.owner, ref: o.opportunityNo, screen: "pipeline", param: "op" }); } });
    leadsOf().forEach(function (l) { if (OPEN_LEAD.indexOf(l.status) !== -1 && l.nextAction) { out.push({ at: l.nextAction.at, title: l.nextAction.titleTh || JCRM.label("taskTypes", l.nextAction.type), owner: l.owner, ref: l.leadNo, screen: "leads", param: "lead" }); } });
    return out.sort(function (a, b) { return fmt.compareIso(a.at, b.at); });
  }
  function refLink(code, screen, param) {
    if (!code) { return esc(DASH); }
    if (!JCRM.canOpen(screen)) { return '<span class="code">' + esc(code) + "</span>"; }
    var p = {}; p[param] = code;
    return '<a class="code" href="' + esc(JCRM.link(screen, p)) + '">' + esc(code) + "</a>";
  }
  function pinnedNote() { return S.notes.filter(function (n) { return n.pinned; }).sort(function (a, b) { return -fmt.compareIso(a.at, b.at); })[0] || null; }
  function currentConsents() {
    var by = {};
    S.consents.forEach(function (x) { if (!by[x.purpose] || fmt.compareIso(x.capturedAt, by[x.purpose].capturedAt) >= 0) { by[x.purpose] = x; } });
    return D.consentPurposes.map(function (p) { return by[p.code]; }).filter(Boolean);
  }
  function maskPhone(full) { var d = String(full || "").replace(/\D/g, ""); if (d.length === 10) { return d.slice(0, 3) + "-XXX-" + d.slice(-4); } if (d.length === 9) { return d.slice(0, 2) + "-XXX-" + d.slice(-4); } return d.length > 4 ? "XXX-" + d.slice(-4) : "XXX"; }
  function fmtPhone(full) { var d = String(full || "").replace(/\D/g, ""); if (d.length === 10) { return d.slice(0, 3) + "-" + d.slice(3, 6) + "-" + d.slice(6); } if (d.length === 9) { return d.slice(0, 2) + "-" + d.slice(2, 5) + "-" + d.slice(5); } return d; }
  function addHistory(action, field, before, after) { S.history.unshift({ at: NOW, actor: JCRM.currentStaffCode(), action: action, field: field, before: before, after: after }); }

  /* ---------- คอลัมน์ซ้าย ---------- */
  function tagsHtml(canEdit) {
    if (!S.tags.length && !canEdit) { return esc(DASH); }
    return '<div class="c360-tags">' + S.tags.map(function (code) {
      return '<span class="chip c360-tag">' + esc(JCRM.label("tags", code)) + (canEdit ? '<button type="button" data-jcrm-action="c360-tag-remove" data-jcrm-id="' + esc(code) + '" aria-label="ลบ Tag ' + esc(JCRM.label("tags", code)) + '">×</button>' : "") + "</span>";
    }).join("") + (S.tags.length ? "" : '<span class="t-sm t-muted">' + esc(DASH) + "</span>") +
      (canEdit !== null ? permBtn({ label: "+ เพิ่ม Tag", variant: "ghost", size: "sm", permission: "customer.update", action: "c360-tag-add" }) : "") + "</div>";
  }
  function sideHtml(c, d) {
    var canUpdate = JCRM.can("customer.update", cctx());
    var pin = pinnedNote();
    var next = nextActions()[0];
    var branchesUsed = d ? d.branchesUsed : (c.branch ? [c.branch] : []);
    return '<section aria-labelledby="c360-contacts"><h2 id="c360-contacts">ช่องทางติดต่อ</h2>' + ui.contactList(S.no) + "</section>" +
      '<dl class="c360-dl">' +
      "<div><dt>จังหวัด</dt><dd>" + esc(d && d.province ? JCRM.label("provinces", d.province) : DASH) + "</dd></div>" +
      "<div><dt>แหล่งที่มา</dt><dd>" + esc(d && d.sourceTextTh ? d.sourceTextTh : DASH) + "</dd></div>" +
      "<div><dt>อายุลูกค้า</dt><dd>" + esc(d && d.tenureTextTh ? d.tenureTextTh : DASH) + "</dd></div>" +
      "<div><dt>Tag</dt><dd>" + tagsHtml(canUpdate ? true : (JCRM.access("customer.update", cctx()).visible ? false : null)) + "</dd></div>" +
      "<div><dt>สาขาที่เคยใช้บริการ</dt><dd>" + esc(branchesUsed.length ? branchesUsed.map(JCRM.branchName).join(" · ") : DASH) + "</dd></div>" +
      '<div><dt>ผู้ดูแล</dt><dd class="row-between"><span>' + esc(ownerText(c.owner)) + "</span>" +
        permBtn({ label: "เปลี่ยนผู้ดูแล", variant: "ghost", size: "sm", permission: "customer.assign", action: "c360-assign" }) + "</dd></div>" +
      "<div><dt>โน้ตที่ปักหมุด</dt><dd>" + (pin ? esc(pin.body) + '<span class="cell-sub t-xs t-muted" style="display:block">' + esc(JCRM.staffName(pin.by) + " · " + fmt.date(pin.at)) + "</span>" : esc(d ? "ยังไม่มีโน้ตที่ปักหมุด" : DASH)) + "</dd></div>" +
      "<div><dt>นัดติดตามถัดไป</dt><dd>" + (next ? esc(fmt.dateTime(next.at) + " · " + next.title + " · " + JCRM.staffName(next.owner)) : esc(d ? "ยังไม่มีนัดติดตาม" : DASH)) + "</dd></div>" +
      "</dl>";
  }

  /* ---------- หัว + ปุ่ม ---------- */
  function menuItems() {
    var items = [];
    var merge = JCRM.access("customer.merge", cctx());
    if (merge.visible) { items.push({ label: "รวมลูกค้า", action: "c360-merge", reason: merge.allowed ? null : merge.reason }); }
    var dsr = JCRM.access("dsr.create", cctx());
    if (dsr.visible) { items.push({ label: "รับคำขอเจ้าของข้อมูล", action: "c360-dsr", reason: dsr.allowed ? null : dsr.reason }); }
    if (JCRM.can("customer.update", cctx())) { items.push({ label: "ดูประวัติการแก้ไข", action: "c360-goto", id: "audit" }); }
    return items;
  }
  function menuHtml(items) {
    return items.map(function (it) {
      return '<button type="button" class="menu-item" role="menuitem" data-jcrm-action="' + esc(it.action) + '"' + (it.id ? ' data-jcrm-id="' + esc(it.id) + '"' : "") +
        (it.reason ? ' aria-disabled="true" data-tooltip="' + esc(it.reason) + '"' : "") + "><span>" + esc(it.label) + (it.reason ? '<span class="menu-item__label-disabled">' + esc(it.reason) + "</span>" : "") + "</span></button>";
    }).join("");
  }
  function quickContactBtn(c, type, action, label, iconName) {
    var ct = JCRM.find(c.contacts || [], "type", type);
    var acc = JCRM.access("customer.pii.reveal", cctx());
    if (!acc.visible) { return ""; }
    if (!ct) { return '<button type="button" class="c360-qbtn" aria-disabled="true" data-tooltip="ไม่มีข้อมูลช่องทางนี้">' + JCRM.icon(iconName) + "<span>" + esc(label) + "</span></button>"; }
    return '<div class="contact-row" data-customer="' + esc(c.customerNo) + '" data-contact-type="' + esc(type) + '" data-revealed="false"><span class="contact-row__value" hidden></span><span class="contact-row__timer" hidden></span>' +
      '<button type="button" class="c360-qbtn" data-jcrm-contact-action="' + esc(action) + '"' + (acc.allowed ? "" : ' aria-disabled="true" data-tooltip="' + esc(acc.reason) + '"') + ">" + JCRM.icon(iconName) + "<span>" + esc(label) + "</span></button></div>";
  }
  function headerHtml(c, d) {
    var items = menuItems();
    var editBtn = permBtn({ label: "แก้ไข", variant: "secondary", permission: "customer.update", action: "c360-edit" });
    var editQuick = (function () {
      var a = JCRM.access("customer.update", cctx());
      if (!a.visible) { return ""; }
      return '<button type="button" class="c360-qbtn" data-jcrm-action="c360-edit"' + (a.allowed ? "" : ' aria-disabled="true" data-tooltip="' + esc(reasonFor("customer.update")) + '"') + ">" + JCRM.icon("file") + "<span>แก้ไข</span></button>";
    })();
    return '<a class="c360-back" href="' + esc(JCRM.canOpen("customers") ? JCRM.link("customers", {}) : JCRM.landingFile()) + '">' + JCRM.icon("arrowLeft") + "ลูกค้า</a>" +
      '<header class="card c360-head">' + ui.avatar(c.displayName, "lg") +
      '<div class="c360-head__main"><span class="code">' + esc(c.customerNo) + '</span><h1 class="c360-head__name">' + esc(JCRM.customerName(c.customerNo)) + "</h1>" +
        (c.lifecycle || c.badges.length ? ui.customerBadges(c) : "") + "</div>" +
      '<div class="c360-head__actions hide-mobile">' + editBtn +
        (items.length ? '<div class="popover-host"><button type="button" class="icon-btn" data-jcrm-action="c360-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="c360-menu" aria-label="เมนูเพิ่มเติม">' + JCRM.icon("moreV") + "</button>" +
          '<div class="popover menu-popover c360-menu" id="c360-menu" role="menu" hidden>' + menuHtml(items) + "</div></div>" : "") + "</div></header>" +
      '<div class="c360-mactions" role="group" aria-label="การกระทำด่วน">' + quickContactBtn(c, "PHONE", "call", "โทร", "call") + quickContactBtn(c, "LINE_ID", "line", "LINE", "chat") + editQuick +
        '<button type="button" class="c360-qbtn" data-jcrm-action="c360-mmore">' + JCRM.icon("moreV") + "<span>เพิ่มเติม</span></button></div>";
  }
  function statsHtml(d) {
    var s = d ? d.summary : null, L = d ? d.summaryLabels : { contacts: "จำนวนการติดต่อ", storeVisits: "จำนวนครั้งเข้าร้าน", purchases: "จำนวนการซื้อ", lifetimeAmount: "ยอดซื้อสะสม (บาท)" };
    var stat = function (value, unit, label) { return '<div class="c360-stat"><span class="c360-stat__value">' + esc(value) + (unit && value !== DASH ? "<small>" + esc(unit) + "</small>" : "") + '</span><span class="c360-stat__label">' + esc(label) + "</span></div>"; };
    return '<div class="c360-stats" role="group" aria-label="ตัวเลขสรุป">' +
      stat(s ? fmt.int(s.contacts) : DASH, "ครั้ง", L.contacts) + stat(s ? fmt.int(s.storeVisits) : DASH, "ครั้ง", L.storeVisits) +

      else { MG.err = ""; MG.other = o; MG.step = 2; }
    } else if (MG.step === 2) {
      JCRM.$$("#mg-body input[type=radio]:checked").forEach(function (r) { if (r.name === "mg-survivor") { MG.survivor = Number(r.value); } else { MG.choices[r.name.slice(3)] = r.value; } });
      MG.step = 3;
    }
    mergeDraw();
  });
  JCRM.on("mg-back", function () { if (MG) { var t = JCRM.$("#mg-reason"); if (t) { MG.reason = t.value; } MG.step = Math.max(1, MG.step - 1); mergeDraw(); } });
  JCRM.on("mg-confirm", function () {
    if (!MG) { return; }
    var reason = String(JCRM.$("#mg-reason").value || "").trim(), ack = JCRM.$("#mg-ack").checked;
    var re = JCRM.$("#mg-reason-err"), ae = JCRM.$("#mg-ack-err");
    re.hidden = !!reason; re.textContent = reason ? "" : "กรอกเหตุผล";
    if (reason && JCRM.form.containsThaiId(reason)) { re.hidden = false; re.textContent = T.thaiIdRejected; reason = ""; }
    ae.hidden = ack; ae.textContent = ack ? "" : "ต้องติ๊กยืนยันก่อน";
    if (!reason || !ack) { return; }
    var survivor = MG.survivor === 1 ? MG.other.customerNo : S.no;
    MG.ctl.close(); MG = null;
    JCRM.toast("prototype ไม่รวมจริง · ระบบจริงเรียก api.merge_customers (p_duplicate_decision_id = NULL) ออกเลข MG-… แล้วแสดงลูกค้าที่เก็บไว้ " + survivor, "info", { duration: 9000 });
  });

  JCRM.page({ id: "customer-360", render: render, branchPicker: false });

  var flash = JCRM.session.get("jcrm.flash");
  if (flash) { JCRM.session.remove("jcrm.flash"); try { var f = JSON.parse(flash); JCRM.toast(f.message, f.tone || "info"); } catch (e) { /* ข้าม */ } }
})();
</script>
</body>
</html>
