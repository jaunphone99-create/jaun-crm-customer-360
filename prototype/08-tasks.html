<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานที่ต้องติดตาม · JAUN CRM</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/premium.css">
<style>
/* หน้า 08 · งานที่ต้องติดตาม — CANONICAL v2.2 ข้อ 4.4 · 4.7 · 13.6 · 13.7 · 13.10 · 19.2 · sitemap-screen-specs ข้อ 11 · ไม่มี hex */
.tk-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
.tk-filter-toggle { display: none; }
.tk-mobile-add { display: none; }
.kv { display: grid; grid-template-columns: minmax(110px, 36%) minmax(0, 1fr); gap: var(--space-2) var(--space-4); font-size: var(--fs-sm); }
.kv dt { color: var(--text-secondary); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tk-section { display: flex; flex-direction: column; gap: var(--space-2); padding-block: var(--space-4); border-bottom: 1px solid var(--border-subtle); }
.tk-section:first-child { padding-top: 0; }
.tk-section:last-child { border-bottom: 0; }
.tk-section__title { font-size: var(--fs-h4); font-weight: var(--fw-semibold); color: var(--text-heading); }
.tk-comments { display: flex; flex-direction: column; gap: var(--space-2); }
.tk-comment { padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-raised); font-size: var(--fs-sm); }
.tk-comment__meta { font-size: var(--fs-xs); color: var(--text-secondary); }
.tk-lock-note { border-inline-start: 4px solid var(--info-solid); }
.tk-sample-link { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
@media (max-width: 767px) {
  .tk-desktop-add { display: none; }
  .tk-mobile-add { display: inline-flex; }
  .tk-filter-toggle { display: inline-flex; }
  .tk-filters { display: none; }
  .tk-filters[data-open="true"] { display: flex; flex-direction: column; align-items: stretch; }
  .tk-filters[data-open="true"] .field--inline { flex: 1 1 auto; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .kv dd { margin-bottom: var(--space-2); }
}
</style>
</head>
<body data-page="tasks" data-roles="STAFF SUPERVISOR BRANCH_MANAGER OPERATIONS EXECUTIVE BUSINESS_ADMIN">
<div class="app" data-jcrm-app>
  <aside data-jcrm-sidebar></aside>
  <header data-jcrm-topbar></header>
  <main id="main" data-jcrm-main><div class="page" id="page"></div></main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  "use strict";
  var D = JCRM.data, fmt = JCRM.fmt, ui = JCRM.ui, esc = JCRM.esc, DASH = fmt.DASH, T = D.meta.texts;
  var NOW = D.meta.now, TODAY = fmt.dayKey(NOW);
  var K = D.tasksKwan, KIM = K.kim.staff;

  var S = {
    ctx: null, type: "", priority: "", owner: null, view: "list", filtersOpen: false,
    state: {},      /* key → { status, dueAt, remindAt, owner, comments, doneAt } */
    created: [],
    nextTk: D.runningNumbers["TK:2026"] + 1,   /* ตัวนับ TK:2026 หลัง seed = 12,660 (ข้อ 13.0 ข้อ 8) */
    drawer: null, drawerKey: null, paramHandled: false
  };

  function isNil(v) { return v === null || v === undefined || v === ""; }
  function me() { return S.ctx ? S.ctx.staffCode : JCRM.currentStaffCode(); }
  function toIso(v) { return String(v).length === 16 ? v + ":00+07:00" : v; }
  function pad6(n) { var s = String(n); while (s.length < 6) { s = "0" + s; } return s; }
  function copy(o) { var x = {}; Object.keys(o || {}).forEach(function (k) { x[k] = o[k]; }); return x; }
  /* บวกนาทีให้เวลา ISO +07:00 (remind_at = due_at − 15 นาที · ข้อ 4.7) */
  function addMinutes(iso, n) {
    var d = new Date(new Date(toIso(iso)).getTime() + (n + 420) * 60000);
    return d.toISOString().slice(0, 16) + ":00+07:00";
  }

  /* ---------------------------------------------------------------------------
     โมเดลงาน: 12 งานของคุณขวัญ (ข้อ 13.10) · TK-2026-012508 (ข้อ 13.7 · is_next_action) · งานที่สร้างในหน้านี้
     ------------------------------------------------------------------------ */
  function sampleRows() {
    return K.rows.map(function (r) {
      return { key: ui.taskKey(r), taskNo: r.taskNo || null, no: r.no, dueAt: r.dueAt, type: r.type, customerNo: r.customerNo, title: r.title, priority: r.priority,
        owner: r.owner, branch: r.branch, status: "OPEN_UNKNOWN", isNextAction: false, parent: null, remindAt: null, description: null, comments: [], sample: true };
    });
  }
  function extraTasks() {
    return D.tasks.filter(function (t) { return t.taskNo; }).map(function (t) {
      return { key: t.taskNo, taskNo: t.taskNo, no: null, dueAt: t.dueAt, type: t.type, customerNo: t.customerNo, title: t.title, priority: t.priority, owner: t.owner, branch: t.branch,
        status: "OPEN_UNKNOWN", isNextAction: !!t.isNextAction, parent: t.opportunityNo || t.leadNo || null, createdAt: t.createdAt || null, remindAt: null, description: null, comments: [], sample: true, listed: false };
    });
  }
  function withState(t) {
    var s = S.state[t.key], x = copy(t);
    if (s) { Object.keys(s).forEach(function (k) { x[k] = s[k]; }); }
    return x;
  }
  function allTasks() { return sampleRows().concat(extraTasks()).concat(S.created.map(copy)).map(withState); }
  function findTask(key) { return allTasks().filter(function (t) { return t.key === key; })[0] || null; }
  function isClosed(t) { return t.status === "DONE" || t.status === "CANCELLED"; }
  function groupOf(t) {
    if (isClosed(t) || !t.dueAt) { return null; }
    var k = fmt.dayKey(t.dueAt);
    return k < TODAY ? "overdue" : (k === TODAY ? "today" : null);
  }
  function rowCtx(t) { return { branch: t.branch, owner: t.owner }; }
  function parentOf(t) {
    if (!t.parent) { return null; }
    var op = JCRM.find(D.opportunities, "opportunityNo", t.parent);
    if (op) { return { kind: "OPPORTUNITY", no: op.opportunityNo, branch: op.branch, owner: op.owner, open: ["INTERESTED", "QUOTATION", "FOLLOW_UP"].indexOf(op.stage) !== -1, perm: "opportunity.update", closePage: "pipeline", param: "op" }; }
    var ld = JCRM.find(D.leads, "leadNo", t.parent);
    if (ld) { var st = JCRM.find(D.leadStatuses, "code", ld.status); return { kind: "LEAD", no: ld.leadNo, branch: ld.branch, owner: ld.owner, open: !ld.status || (st && st.isOpen), perm: "lead.update", closePage: "leads", param: "lead" }; }
    return null;
  }
  function ownerFilter() { return S.owner; }
  /* งานอยู่ในมุมมองนี้ไหม: task.read บนแถว (ไม่มี read-through · ข้อ 9.4) + สาขา + ตัวกรองผู้รับผิดชอบ */
  function inView(t, effB) {
    if (!JCRM.can("task.read", rowCtx(t))) { return false; }
    if (effB !== "ALL" && t.branch !== effB) { return false; }
    if (ownerFilter() && t.owner !== ownerFilter()) { return false; }
    return true;
  }
  function filtered(t) { return (!S.type || t.type === S.type) && (!S.priority || t.priority === S.priority); }

  function viewData(ctx) {
    var base = JCRM.select.tasksFor(undefined, { branch: ctx.branch, owner: ownerFilter(), group: "all" });
    if (!base) { return null; }
    var rb = JCRM.scopeBranches("task.read", "OWN");
    var effB = ctx.branch === "ALL" && rb.length === 1 ? rb[0] : ctx.branch;
    var baseKeys = base.rows.map(function (r) { return ui.taskKey(r); });
    var rows = [], counts = base.counts ? { today: base.counts.today, overdue: base.counts.overdue } : null;
    /* งานตัวอย่าง: อยู่ในมุมมองเมื่อ selector คืนมา (baseKeys) หรือถูกเปลี่ยนในหน้านี้แล้วยังผ่าน task.read + ตัวกรอง
       จำนวนตามข้อ 13.10/13.6 ปรับด้วยการเปลี่ยน: ออกจากกลุ่มเดิม −1 · เข้ากลุ่มใหม่ +1 */
    sampleRows().concat(extraTasks()).forEach(function (o) {
      var e = withState(o), origIn = baseKeys.indexOf(o.key) !== -1, changed = !!S.state[o.key];
      var effIn = (origIn || changed) && inView(e, effB);
      if (effIn && groupOf(e)) { rows.push(e); }
      if (counts && changed) {
        var g0 = origIn ? groupOf(o) : null, g1 = effIn ? groupOf(e) : null;
        if (g0) { counts[g0] -= 1; }
        if (g1) { counts[g1] += 1; }
      }
    });
    S.created.forEach(function (c) { var e = withState(c); var g = inView(e, effB) ? groupOf(e) : null; if (g) { rows.push(e); if (counts) { counts[g] += 1; } } });
    if (counts) { counts.total = counts.today + counts.overdue; }
    var shown = rows.filter(filtered);
    var cnt = function (list) { var t = list.filter(function (x) { return groupOf(x) === "today"; }).length, o = list.filter(function (x) { return groupOf(x) === "overdue"; }).length; return { today: t, overdue: o, total: t + o }; };
    var shownCounts = counts;
    if (S.type || S.priority) {
      var complete = base.counts && baseKeys.length === base.counts.total;
      var kimOnly = base.counts && !baseKeys.length && (ownerFilter() === KIM || (JCRM.topScope("task.read") === "OWN" && me() === KIM));
      if (complete) { shownCounts = cnt(shown); }
      else if (kimOnly && !S.priority) {
        /* งานของคุณคิม "ทั้งหมด FOLLOW_UP" (ข้อ 13.10) → ตัวกรองประเภทอื่น = 0 */
        var add = cnt(shown), b0 = S.type === "FOLLOW_UP" ? base.counts : { today: 0, overdue: 0 };
        shownCounts = { today: b0.today + add.today, overdue: b0.overdue + add.overdue }; shownCounts.total = shownCounts.today + shownCounts.overdue;
      } else { shownCounts = null; }
    }
    return { base: base, effB: effB, rows: shown, counts: shownCounts };
  }

  /* ---------------------------------------------------------------------------
     render
     ------------------------------------------------------------------------ */
  function selectHtml(id, label, options, value, action) {
    return '<div class="field field--inline"><label class="label" for="' + esc(id) + '">' + esc(label) + '</label><select class="select" id="' + esc(id) + '" data-jcrm-change="' + esc(action) + '">' +
      options.map(function (o) { return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(value || "") ? " selected" : "") + ">" + esc(o.label) + "</option>"; }).join("") + "</select></div>";
  }
  function groupsFor(rows, counts, which) {
    var sorted = rows.slice().sort(function (a, b) { return fmt.compareIso(a.dueAt, b.dueAt); });
    return ["overdue", "today"].filter(function (g) { return which === "all" || which === g; }).map(function (g) {
      return { key: g, label: g === "overdue" ? "เกินกำหนด" : "วันนี้", rows: sorted.filter(function (t) { return groupOf(t) === g; }), count: counts ? counts[g] : null };
    });
  }
  function render(ctx) {
    S.ctx = ctx;
    var host = document.getElementById("page");
    var v = viewData(ctx);
    if (!v) { host.innerHTML = ui.noPermission({ roles: ctx.screen.roles }); return; }
    var top = JCRM.topScope("task.read");
    var addBtn = { label: "+ เพิ่มงาน", variant: "accent", permission: "task.create", action: "tk-create" };
    var header = ui.pageHeader({
      title: "งานที่ต้องติดตาม", lead: "งานของวันนี้ · " + fmt.date(NOW) + " · ทั้งหมด = วันนี้ + เกินกำหนด (ข้อ 4.7)",
      actions: [JCRM.raw('<span class="tk-desktop-add">' + ui.permButton(addBtn) + "</span>"),
        JCRM.raw('<span class="tk-mobile-add">' + ui.permButton({ label: "เพิ่มงาน", variant: "accent", permission: "task.create", action: "tk-create", icon: "plus", iconOnly: true }) + "</span>")]
    });
    var owners = [];
    if (top !== "OWN" && (v.effB === "JP1") && JCRM.scopeBranches("task.read", "OWN").indexOf("JP1") !== -1) { owners = [K.staff, KIM]; }
    if (S.owner && owners.indexOf(S.owner) === -1) { owners.push(S.owner); }
    var activeFilters = [S.type, S.priority, S.owner].filter(Boolean).length;
    var filters = '<div class="filter-bar filter-bar--panel tk-filters" data-open="' + S.filtersOpen + '" id="tk-filters" role="group" aria-label="ตัวกรองงาน">' +
      selectHtml("tk-type", "ประเภทงาน", [{ value: "", label: "ทั้งหมด" }].concat(D.taskTypes.map(function (x) { return { value: x.code, label: x.labelTh + (x.code === "FOLLOW_UP" ? " (Follow-ups)" : "") }; })), S.type, "tk-type") +
      selectHtml("tk-priority", "ความสำคัญ", [{ value: "", label: "ทั้งหมด" }].concat(D.priorities.map(function (x) { return { value: x.code, label: x.labelTh }; })), S.priority, "tk-priority") +
      (top === "OWN" ? "" : selectHtml("tk-owner", "ผู้รับผิดชอบ", [{ value: "", label: "ทั้งหมด" }].concat(owners.map(function (c) { return { value: c, label: JCRM.staffName(c) }; })), S.owner, "tk-owner")) +
      ui.branchSelect({ id: "tk-branch", permission: "task.read", value: ctx.branch, action: "tk-branch" }) +
      (activeFilters ? '<div class="filter-bar__clear">' + ui.button({ label: "ล้างตัวกรอง", variant: "ghost", size: "sm", action: "tk-clear" }) + "</div>" : "") + "</div>";
    var toolbar = '<div class="tk-toolbar">' +
      '<button type="button" class="btn btn--secondary btn--sm tk-filter-toggle" data-jcrm-action="tk-filters" aria-expanded="' + S.filtersOpen + '" aria-controls="tk-filters">' + JCRM.icon("filter") + "<span>ตัวกรอง (" + activeFilters + ")</span></button>" +
      ui.segmented({ label: "มุมมอง", action: "tk-view", value: S.view, options: [{ value: "list", label: "รายการ" }, { value: "calendar", label: "ปฏิทิน 🔒" }] }) + "</div>";

    var body;
    if (S.view === "calendar") {
      body = '<div class="card">' + ui.state("locked", { title: "มุมมองปฏิทิน · Phase 2 [รอยืนยัน]", phase: "2", text: "มุมมองปฏิทินของหน้างานยังไม่เปิดใน prototype Phase 0 (CANONICAL ข้อ 14.2) · ใช้มุมมองรายการ" }) + "</div>";
    } else {
      var showOwner = top !== "OWN";
      var mk = function (which, emptyTitle) {
        return ui.taskList({ groups: groupsFor(v.rows, v.counts, which), showOwner: showOwner, openAction: "tk-open",
          empty: { title: emptyTitle, compact: true, action: v.base.empty && which === "all" ? ui.permButton(addBtn) : "" } });
      };
      var sample = v.base.sample ? ui.sampleNote(v.base.sample) : "";
      body = sample + '<div class="card card--flush" style="padding:var(--space-2) var(--space-4) var(--space-4)">' + ui.tabs({ id: "tk-groups", label: "กลุ่มงาน", param: "group", selected: "all", tabs: [
        { id: "all", label: "ทั้งหมด", count: v.counts ? v.counts.total : null, html: mk("all", "ไม่มีงานที่ต้องทำวันนี้") },
        { id: "today", label: "วันนี้", count: v.counts ? v.counts.today : null, html: mk("today", "ไม่มีงานที่ต้องทำวันนี้") },
        { id: "overdue", label: "เกินกำหนด", count: v.counts ? v.counts.overdue : null, html: mk("overdue", "ไม่มีงานเกินกำหนด") }
      ] }) + "</div>";
    }
    var tk = extraTasks()[0];
    var sampleLink = tk && JCRM.can("task.read", rowCtx(tk)) ? '<div class="card card--raised tk-sample-link"><span class="t-sm">ตัวอย่างงานที่เป็นการติดตามถัดไป (แก้ผู้รับผิดชอบ/วันครบกำหนด/ประเภทตรงไม่ได้ · ข้อ 19.2): <span class="code">' + esc(tk.taskNo) + "</span> " +
      esc(tk.title) + " · ครบกำหนด " + esc(fmt.dateTime(tk.dueAt)) + " จึงไม่อยู่ในกลุ่มวันนี้/เกินกำหนด</span>" + ui.button({ label: "เปิดรายละเอียดงาน", variant: "ghost", size: "sm", action: "tk-open", id: tk.taskNo }) + "</div>" : "";
    host.innerHTML = header + toolbar + filters + '<div class="stack">' + body + sampleLink +
      '<p class="proto-note">ทำเสร็จ เลื่อนนัด มอบหมาย ยกเลิก เพิ่มงาน และความคิดเห็น เก็บในหน่วยความจำของหน้านี้เท่านั้น · ระบบจริง UPDATE crm.tasks ผ่าน RLS (task.read ไม่มี read-through ผ่านลูกค้า) · มอบหมายผ่าน api.assign_owner · เลข TK ของ 12 งานในข้อ 13.10 ไม่มีในข้อมูลตัวอย่าง</p></div>';
    if (!v.counts) { JCRM.$$(".group-head", host).forEach(function (h) { h.textContent = h.textContent.replace(/\s*\(\d[\d,]*\)\s*$/, ""); }); }
  }
  function rerender() { if (S.ctx) { render(JCRM.state()); JCRM.initTabs(document); } }
  function refreshDrawer() { if (S.drawer && S.drawerKey) { var k = S.drawerKey; S.drawer.close(); S.drawer = null; openDrawer(k); } }
  function closeDrawer() { if (S.drawer) { S.drawer.close(); S.drawer = null; S.drawerKey = null; } }

  /* ---------------------------------------------------------------------------
     Drawer รายละเอียดงาน (480px · sitemap ข้อ 11.5)
     ------------------------------------------------------------------------ */
  function kv(rows) { return '<dl class="kv">' + rows.map(function (r) { return '<div style="display:contents"><dt>' + esc(r[0]) + "</dt><dd>" + r[1] + "</dd></div>"; }).join("") + "</dl>"; }
  function txt(v) { return isNil(v) ? '<span class="t-muted">' + DASH + "</span>" : esc(v); }
  function statusText(t) { return t.status === "OPEN_UNKNOWN" ? "เปิด/กำลังทำ (ข้อมูลตัวอย่างไม่ระบุ)" : JCRM.label("taskStatuses", t.status); }
  function openDrawer(key) {
    var t = findTask(key);
    if (!t || !JCRM.can("task.read", rowCtx(t))) {
      S.drawer = JCRM.drawer({ title: "รายละเอียดงาน", ref: key && key.indexOf("TK-") === 0 ? key : null, body: ui.state("notfound", {}), footer: ui.button({ label: "ปิด", variant: "ghost", attrs: "data-jcrm-overlay-cancel" }), onCancel: function () { S.drawer = null; } });
      S.drawerKey = null; return;
    }
    var rc = rowCtx(t), closed = isClosed(t), p = parentOf(t), g = groupOf(t);
    var timeBadge = g === "overdue" ? ui.badge("เกินกำหนด", "danger", "badge--square") : (g === "today" && fmt.compareIso(t.dueAt, NOW) < 0 ? ui.badge("เลยเวลา", "warning", "badge--square") : "");
    var head = '<div class="tk-section"><p class="t-h3">' + esc(t.title || DASH) + '</p><div class="badge-row">' + ui.badge(JCRM.label("taskTypes", t.type), "neutral", "badge--square") + ui.priorityBadge(t.priority) + timeBadge +
      (closed ? ui.status("taskStatuses", t.status) : "") + "</div></div>";
    var lock = t.isNextAction && p ? '<p class="alert tk-lock-note" role="note">' + JCRM.icon("lock", "nav-icon") + '<span>เป็นการติดตามถัดไปของ <a class="code" href="' + esc(JCRM.link(p.closePage, (function () { var o = {}; o[p.param] = p.no; return o; })())) + '">' + esc(p.no) +
      "</a> · ผู้รับผิดชอบ สาขา วันครบกำหนด และประเภทแก้ตรงที่งานไม่ได้ (ข้อ 19.2 ข้อ 3) · ทำเสร็จแล้วต้องตั้งการติดตามครั้งถัดไป</span></p>" : "";
    var info = '<div class="tk-section">' + lock + kv([
      ["เลขงาน", t.taskNo ? '<span class="code">' + esc(t.taskNo) + "</span>" : txt(null)],
      ["ประเภท", txt(JCRM.label("taskTypes", t.type))],
      ["สถานะ", txt(statusText(t))],
      ["ความสำคัญ", txt(t.priority ? JCRM.label("priorities", t.priority) : null)],
      ["ครบกำหนด", txt(t.dueAt ? fmt.dateTime(t.dueAt) : null)],
      ["เตือนเมื่อ", txt(t.remindAt ? fmt.dateTime(t.remindAt) : null)],
      ["ลูกค้า", t.customerNo && JCRM.customer(t.customerNo) ? '<a href="' + esc(JCRM.link("customer-360", { c: t.customerNo })) + '">' + esc(JCRM.customerName(t.customerNo)) + '</a> <span class="code">' + esc(t.customerNo) + "</span>" : txt(null)],
      ["Lead/โอกาสขายที่ผูก", p ? '<a class="code" href="' + esc(JCRM.link(p.closePage, (function () { var o = {}; o[p.param] = p.no; return o; })())) + '">' + esc(p.no) + "</a>" : txt(null)],
      ["ผู้รับผิดชอบ", txt(t.owner ? JCRM.staffName(t.owner) : "ยังไม่มีผู้รับผิดชอบ")],
      ["สาขา", txt(JCRM.branchName(t.branch))],
      ["รายละเอียด", txt(t.description)]
    ]) + "</div>";
    var canComment = !closed && JCRM.access("task.update", rc);
    var comments = '<div class="tk-section"><h3 class="tk-section__title">ความคิดเห็น</h3><div class="tk-comments">' + ((t.comments || []).length ? t.comments.map(function (c) {

        var g = groupOf(findTask(no));
        JCRM.toast("เพิ่มงาน " + no + " แล้วในหน้านี้ (ไม่บันทึกจริง)" + (g ? "" : " · ครบกำหนด " + fmt.dateTime(toIso(v.due_at)) + " จึงไม่อยู่ในกลุ่มวันนี้/เกินกำหนด"), "success", { title: "prototype" });
        return true;
      } });
  });

  var ctx0 = JCRM.page({ id: "tasks", render: render });
  if (ctx0 && ctx0.allowed && !S.paramHandled) {
    S.paramHandled = true;
    var tp = JCRM.qs("task");
    if (tp) { openDrawer(tp); }
  }
})();
</script>
