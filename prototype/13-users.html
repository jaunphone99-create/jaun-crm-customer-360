<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้ใช้งานและสิทธิ์ · JAUN CRM</title>
<link rel="stylesheet" href="assets/app.css">
<style>
/* หน้า 13 · ผู้ใช้งานและสิทธิ์ — CANONICAL v2.2 ข้อ 7 · 8.1 · 9.2 · 13.5 · 13.14 · sitemap-screen-specs ข้อ 16 · ไม่มี hex */
.u-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-4) var(--space-5) 0; }
.u-toolbar .filter-bar { margin-bottom: 0; }
.u-search { min-width: 220px; }
.u-tabpanel { padding-top: var(--space-4); }
.u-menu { position: fixed; right: auto; }
.u-menu .menu-item { font-size: var(--fs-sm); }
.u-menu__danger { color: var(--danger-text); }
.u-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-2) var(--space-4); margin: 0; font-size: var(--fs-sm); }
.u-dl dt { color: var(--text-secondary); }
.u-dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.u-asg { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-subtle); }
.u-asg:last-child { border-bottom: 0; }
.u-member { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; padding: var(--space-2) 0; border-bottom: 1px solid var(--border-subtle); }
.u-actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.u-panel { margin-top: var(--space-4); }
.u-name { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
@media (max-width: 1279px) { .u-search { min-width: 180px; } }
</style>
</head>
<body data-page="users" data-roles="SUPERVISOR BRANCH_MANAGER OPERATIONS EXECUTIVE BUSINESS_ADMIN SYSTEM_ADMIN">
<div class="app" data-jcrm-app>
  <aside data-jcrm-sidebar></aside>
  <header data-jcrm-topbar></header>
  <main id="main" data-jcrm-main><div class="page" id="page"></div></main>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ============================================================================
   หน้า 13 · ผู้ใช้งานและสิทธิ์ (users) · แท็บ ผู้ใช้งาน · ทีม · คำขอมอบบทบาท · อุปกรณ์
   แหล่ง: CANONICAL v2.2 ข้อ 2 (ทีม) · 7 · 7.1 · 7.2 · 7.3 · 8.1 (user.* role.* team.manage) · 9.2 (อุปกรณ์ counter) · 9.6 · 13.5 · 13.14 (RG-2026-0003)
   ระบบจริง: api.list_staff · api.update_staff · api.can_assign_role · api.assign_role · api.revoke_role · api.disable_staff + disable-staff
            · invite-staff · reset-mfa · api.request_role_grant · api.decide_role_grant · api.list_role_grant_requests · api.save_team
            · api.set_team_member · api.register_device
   prototype: ทุกการเปลี่ยนแปลงอยู่ในหน่วยความจำของหน้า (โหลดใหม่ = ข้อมูลตัวอย่างเดิม) · ไม่มีการส่งอีเมลหรือบันทึกจริง
   ========================================================================= */
(function () {
  "use strict";
  var D = JCRM.data, ui = JCRM.ui, fmt = JCRM.fmt, esc = JCRM.esc;
  var DASH = fmt.DASH, NOW = D.meta.now;
  var HIGH_ROLES = ["EXECUTIVE", "BUSINESS_ADMIN", "SYSTEM_ADMIN"];
  var BRANCH_ROLES = D.roles.filter(function (r) { return r.isBranchRole; }).map(function (r) { return r.code; });
  var SELF = "ทำรายการกับบัญชีของตนเองไม่ได้";
  var extra = {};           /* ข้อมูลที่ข้อ 13 ไม่มี (ชื่อเล่น เบอร์ รหัสพนักงาน ผู้เชิญ) + ค่าที่แก้ในหน้านี้ */
  var ended = {};           /* assignment ที่สิ้นสุดเมื่อปิดใช้งาน (ใช้ตัดสินกติกาของบัญชีที่ปิดใช้งานแล้ว) */
  var reqState = {};        /* ผลการตัดสินคำขอในหน้านี้ */
  var localRequests = [];
  var devices = [];
  var filters = { q: "", role: "ALL", branch: "ALL", status: "ALL" };
  var selectedRequest = null;
  var detailCtl = null;

  /* คุณโอ๊ต: วันที่เชิญตามข้อ 13.14 · ผู้เชิญและรหัสพนักงานไม่มีในข้อ 13 (แสดง –) */
  D.roleGrantRequests.forEach(function (q) { extraOf(q.target).invitedAt = q.targetInvitedAt; });

  function extraOf(code) { extra[code] = extra[code] || {}; return extra[code]; }
  function me() { return JCRM.currentStaffCode(); }
  function roleLabel(code) { var r = JCRM.role(code); return r ? r.labelTh : DASH; }
  function rulesAssignments(s) { return s.status === "DISABLED" ? (ended[s.staffCode] || []) : s.assignments; }
  function hasRole(s, role) { return rulesAssignments(s).some(function (a) { return a.role === role; }); }
  function isBusiness(s) { return rulesAssignments(s).some(function (a) { return a.role !== "SYSTEM_ADMIN"; }); }
  function reqOf(q) {
    var st = reqState[q.requestNo] || {};
    return { requestNo: q.requestNo, type: q.type || "GRANT", role: q.role, target: q.target, requestedBy: q.requestedBy, requestedAt: q.requestedAt,
      reason: q.reason || null, status: st.status || q.status || "REQUESTED", decidedBy: st.decidedBy || null, decidedAt: st.decidedAt || null, decisionNote: st.note || null, targetInvitedAt: q.targetInvitedAt || null };
  }
  function allRequests() {
    return D.roleGrantRequests.concat(localRequests).map(reqOf).sort(function (a, b) { return -fmt.compareIso(a.requestedAt, b.requestedAt); });
  }
  function pendingRequestFor(s) { return allRequests().filter(function (q) { return q.target === s.staffCode && q.status === "REQUESTED"; })[0] || null; }
  function bmManageable(s, perm) {
    var bs = JCRM.scopeBranches(perm, "BRANCH");
    var asg = rulesAssignments(s);
    return asg.length > 0 && asg.every(function (a) { return (a.role === "STAFF" || a.role === "SUPERVISOR") && bs.indexOf(a.branch) !== -1; });
  }
  function lastActiveHighReason(s) {
    if (hasRole(s, "EXECUTIVE") && D.staff.filter(function (x) { return x.status === "ACTIVE" && hasRole(x, "EXECUTIVE"); }).length <= 1) { return "ปิดใช้งานผู้บริหารที่ใช้งานอยู่คนสุดท้ายไม่ได้"; }
    if (hasRole(s, "BUSINESS_ADMIN") && D.staff.filter(function (x) { return x.status === "ACTIVE" && hasRole(x, "BUSINESS_ADMIN"); }).length <= 1) { return "ปิดใช้งานผู้ดูแลข้อมูลธุรกิจที่ใช้งานอยู่คนสุดท้ายไม่ได้"; }
    return null;
  }
  function plus24h(iso) { return fmt.addDays(fmt.dayKey(iso), 1) + iso.slice(10); }
  function nextStaffCode() {
    var n = D.runningNumbers.ST + D.staff.filter(function (s) { return extraOf(s.staffCode).createdHere; }).length + 1;
    return "ST-" + String(10000 + n).slice(1);
  }
  function nextRequestNo() {
    var n = D.runningNumbers["RG:2026"] + localRequests.length + 1;
    return "RG-2026-" + String(10000 + n).slice(1);
  }

  /* ---------------------------------------------- การกระทำต่อแถว (ข้อ 7.2 · 7.3 · 8.1) */
  function rowActions(s) {
    var self = s.staffCode === me(), disabled = s.status === "DISABLED", out = [];
    function add(key, label, reason) { out.push({ key: key, label: label, reason: reason || null }); }
    /* แก้ไขโปรไฟล์ — user.update B (ทุก assignment เป็น STAFF/SUPERVISOR ในสาขาตน · ข้อ 7.3 ข้อ 5) · G · S¹ (บัญชีที่ไม่มีบทบาทธุรกิจ) */
    (function () {
      var acc = JCRM.access("user.update"); if (!acc.visible) { return; }
      if (self) { add("edit", "แก้ไขโปรไฟล์", SELF); return; }
      var mode = JCRM.topScope("user.update");
      if (mode === "BRANCH" && !bmManageable(s, "user.update")) { return; }
      if (mode === "SYSTEM" && isBusiness(s)) { return; }
      add("edit", "แก้ไขโปรไฟล์", acc.allowed ? null : acc.reason);
    })();
    /* มอบบทบาท — role.assign 🔐 (ข้อ 7.2) */
    (function () {
      var acc = JCRM.access("role.assign"); if (!acc.visible) { return; }
      if (self) { add("assign", "มอบบทบาท", SELF); return; }
      var mode = JCRM.topScope("role.assign");
      if (mode === "BRANCH" && !bmManageable(s, "role.assign")) { return; }
      if (hasRole(s, "SYSTEM_ADMIN")) { return; }   /* SYSTEM_ADMIN ห้ามถือร่วมกับบทบาทธุรกิจ (ข้อ 7.1) */
      if (disabled) { add("assign", "มอบบทบาท", "มอบบทบาทให้บัญชีที่ปิดใช้งานไม่ได้"); return; }
      if (!isBusiness(s) && pendingRequestFor(s)) { add("assign", "มอบบทบาท", "บัญชีสายผู้ดูแลระบบ (IT) รับบทบาทธุรกิจได้หลังผู้ดูแลข้อมูลธุรกิจยืนยันตัวตนกับ HR (ข้อ 7.2)"); return; }
      add("assign", "มอบบทบาท", acc.allowed ? null : acc.reason);
    })();
    /* เปลี่ยนอีเมล/รีเซ็ต MFA — บัญชี STAFF และบทบาท ≥ SUPERVISOR → BUSINESS_ADMIN · บัญชี BA/EX/SA → EXECUTIVE (ข้อ 7.3 ข้อ 6) */
    (function () {
      var mine = JCRM.roleCodes();
      var high = HIGH_ROLES.some(function (r) { return hasRole(s, r); });
      var ok = (mine.indexOf("BUSINESS_ADMIN") !== -1 && !high && rulesAssignments(s).length > 0) || (mine.indexOf("EXECUTIVE") !== -1 && high);
      if (!ok || self) { return; }
      add("reset", "เปลี่ยนอีเมล/รีเซ็ต MFA", disabled ? "บัญชีนี้ปิดใช้งานแล้ว" : null);
    })();
    /* ส่งคำเชิญใหม่ — เฉพาะบัญชีเชิญแล้วที่คำเชิญหมดอายุ (ข้อ 9.2 · 19.3 ข้อ 6) */
    (function () {
      if (s.status !== "INVITED") { return; }
      var mode = JCRM.topScope("user.invite");
      var can = mode === "SYSTEM" ? !isBusiness(s) : (mode === "ORGANIZATION" ? isBusiness(s) : (mode === "BRANCH" ? bmManageable(s, "user.invite") : false));
      if (!can) { return; }
      var exp = extraOf(s.staffCode).inviteExpiresAt;
      add("resend", "ส่งคำเชิญใหม่", exp && fmt.compareIso(NOW, exp) < 0 ? "คำเชิญยังไม่หมดอายุ (หมดอายุ " + fmt.dateTime(exp) + ")" : null);
    })();
    /* ปิดใช้งาน — user.disable 🔐 (ข้อ 7.3 ข้อ 4–5) */
    (function () {
      var acc = JCRM.access("user.disable"); if (!acc.visible) { return; }
      if (self) { add("disable", "ปิดใช้งาน", SELF); return; }
      var mode = JCRM.topScope("user.disable");
      if (mode === "BRANCH" && !bmManageable(s, "user.disable")) { return; }
      if (mode === "SYSTEM" && isBusiness(s)) { return; }
      if (disabled) { add("disable", "ปิดใช้งาน", "บัญชีนี้ปิดใช้งานแล้ว"); return; }
      var last = lastActiveHighReason(s);
      add("disable", "ปิดใช้งาน", last || (acc.allowed ? null : acc.reason));
    })();
    return out;
  }
  /* ถอนบทบาท (ข้อ 7.2 · ข้อ 7.3 ข้อ 5 · permission-matrix 6.2) */
  function revokeReason(s, a) {
    if (s.staffCode === me()) { return SELF; }
    if (HIGH_ROLES.indexOf(a.role) !== -1) { return "ถอนบทบาทนี้ใช้คำขอชนิดถอน (ผู้ดูแลระบบยื่น · ผู้บริหารอนุมัติ)"; }
    var mode = JCRM.topScope("role.assign");
    if (mode === "BRANCH" && !((a.role === "STAFF" || a.role === "SUPERVISOR") && JCRM.scopeBranches("role.assign", "BRANCH").indexOf(a.branch) !== -1)) {
      return "ผู้จัดการสาขาถอนได้เฉพาะบทบาทพนักงานขาย/แอดมินและหัวหน้าทีมในสาขาของตน";
    }
    var acc = JCRM.access("role.assign");
    return acc.allowed ? null : acc.reason;
  }

  /* --------------------------------------------------------------- ข้อความ */
  function roleText(s) {
    if (s.status === "DISABLED") { return "– (บทบาทสิ้นสุดเมื่อปิดใช้งาน)"; }
    if (!s.assignments.length) {
      var q = pendingRequestFor(s);
      return q ? "– (รอคำขอ " + roleLabel(q.role) + " · " + q.requestNo + ")" : DASH;
    }
    var t = JCRM.assignmentText(s, { branchNames: true });
    return s.status === "INVITED" ? t + " (มีผลเมื่อเปิดใช้งาน)" : t;
  }
  function teamText(s) {
    var list = D.teamMembers.filter(function (m) { return m.staff === s.staffCode; }).map(function (m) { return m.team + (m.isLeader ? " (หัวหน้า)" : ""); });
    return list.length ? list.join(" · ") : DASH;
  }
  function staffWithCode(code) { var s = JCRM.staff(code); return s ? s.displayName + " (" + code + ")" : DASH; }

  /* ------------------------------------------------------------------ แท็บ */
  function tabVisibility() {
    var roles = JCRM.roleCodes();
    return {
      teams: JCRM.topScope("user.read") !== "SYSTEM" && JCRM.topScope("user.read") !== null,
      requests: JCRM.can("role.decide") || JCRM.can("role.request") || roles.indexOf("BUSINESS_ADMIN") !== -1,   /* หมายเหตุผู้เขียน S32: EX อนุมัติ · SA ยื่น · BA อ่านอย่างเดียว */
      devices: JCRM.scopeBranches("user.update", "BRANCH").length > 0
    };
  }

  /* ---- แท็บผู้ใช้งาน ---- */
  /* รายชื่อตาม user.read (ข้อ 8.0 · 8.1): T สมาชิกทีมที่ตนนำ · B ผู้มีบทบาทในสาขา (รวมบัญชีที่ปิดใช้งานในหน้านี้) · G/S ทุกบัญชี — ตรรกะเดียวกับ JCRM.select.staffListFor */
  function readableStaff() {
    var top = JCRM.topScope("user.read");
    if (!top) { return []; }
    if (top === "ORGANIZATION" || top === "SYSTEM") { return D.staff.slice(); }
    if (top === "TEAM") {
      var members = [];
      JCRM.effectiveAssignments().filter(function (a) { return a.role === "SUPERVISOR"; }).forEach(function (a) {
        JCRM.teamMembersLedBy(me(), a.branch).forEach(function (m) { if (members.indexOf(m) === -1) { members.push(m); } });
      });
      return D.staff.filter(function (s) { return members.indexOf(s.staffCode) !== -1; });
    }
    var bs = JCRM.scopeBranches("user.read", "BRANCH");
    return D.staff.filter(function (s) { return rulesAssignments(s).some(function (a) { return a.branch && bs.indexOf(a.branch) !== -1; }); });
  }
  function filteredStaff() {
    var list = readableStaff().sort(function (a, b) { return a.staffCode < b.staffCode ? -1 : 1; });
    var q = filters.q.trim().toLowerCase();
    return list.filter(function (s) {
      if (q && s.displayName.toLowerCase().indexOf(q) === -1 && s.staffCode.toLowerCase().indexOf(q) === -1) { return false; }
      if (filters.role !== "ALL" && !rulesAssignments(s).some(function (a) { return a.role === filters.role; })) { return false; }
      if (filters.branch !== "ALL" && !rulesAssignments(s).some(function (a) { return a.branch === filters.branch; })) { return false; }
      if (filters.status !== "ALL" && s.status !== filters.status) { return false; }
      return true;
    });
  }
  function usersTable() {
    var base = readableStaff();
    var rows = filteredStaff();
    var hasFilter = filters.q.trim() || filters.role !== "ALL" || filters.branch !== "ALL" || filters.status !== "ALL";
    return ui.table({
      id: "u-users", caption: "ผู้ใช้งาน", rowKey: "staffCode", rowAction: "u-detail",
      columns: [
        { key: "staffCode", label: "รหัสพนักงาน", format: "code" },
        { key: "displayName", label: "ชื่อ", render: function (s) { var nick = extraOf(s.staffCode).nickname; return '<span class="u-name">' + ui.avatar(s.displayName, "sm") + "<span>" + esc(s.displayName) + (nick ? '<span class="cell-sub">' + esc(nick) + "</span>" : "") + "</span></span>"; } },
        { key: "assignments", label: "บทบาท @ ขอบเขต", render: function (s) { return esc(roleText(s)); } },
        { key: "team", label: "ทีม", hide: "tablet", render: function (s) { return esc(teamText(s)); } },
        { key: "email", label: "อีเมล", hide: "tablet" },
        { key: "status", label: "สถานะ", format: "status:staffStatus" },
        { key: "staffCode", label: "การกระทำ", render: function (s) {
          var acts = rowActions(s);
          return acts.length ? '<button type="button" class="icon-btn icon-btn--sm" data-u-menu="' + esc(s.staffCode) + '" aria-haspopup="menu" aria-expanded="false" aria-label="การกระทำของ ' + esc(s.displayName) + '">' + JCRM.icon("moreV") + "</button>" : "";
        } }
      ],
      rows: rows,
      emptyKind: hasFilter ? "noresult" : "empty",
      empty: hasFilter ? { title: "ไม่พบผู้ใช้งาน", clearAction: "u-clear" } : { title: "ไม่พบผู้ใช้งาน" },
      footer: { shown: rows.length, total: base.length, unit: "บัญชี" }
    });
  }
  function usersPanel() {
    var readable = readableStaff();
    var roleOpts = D.roles.map(function (r) { return '<option value="' + r.code + '"' + (filters.role === r.code ? " selected" : "") + ">" + esc(r.labelTh) + "</option>"; }).join("");
    var brSet = [];
    readable.forEach(function (s) { rulesAssignments(s).forEach(function (a) { if (a.branch && brSet.indexOf(a.branch) === -1) { brSet.push(a.branch); } }); });
    brSet.sort();
    var brOpts = brSet.map(function (b) { return '<option value="' + b + '"' + (filters.branch === b ? " selected" : "") + ">" + esc(JCRM.branchName(b)) + "</option>"; }).join("");
    var stOpts = D.enums.staffStatus.map(function (x) { return '<option value="' + x.code + '"' + (filters.status === x.code ? " selected" : "") + ">" + esc(x.labelTh) + "</option>"; }).join("");
    var hasFilter = filters.q.trim() || filters.role !== "ALL" || filters.branch !== "ALL" || filters.status !== "ALL";
    return '<div class="u-tabpanel"><div class="filter-bar filter-bar--panel" role="search" aria-label="ตัวกรองผู้ใช้งาน">' +
      '<div class="field u-search"><label class="label" for="u-q">ค้นหาชื่อหรือรหัสพนักงาน</label><input class="input" id="u-q" type="search" autocomplete="off" value="' + esc(filters.q) + '" placeholder="เช่น คุณขวัญ หรือ ST-0045"></div>' +
      '<div class="field field--inline"><label class="label" for="u-role">บทบาท</label><select class="select" id="u-role" data-jcrm-change="u-filter-role"><option value="ALL">ทั้งหมด</option>' + roleOpts + "</select></div>" +
      '<div class="field field--inline"><label class="label" for="u-branch">สาขา</label><select class="select" id="u-branch" data-jcrm-change="u-filter-branch"><option value="ALL">ทั้งหมด</option>' + brOpts + "</select></div>" +
      '<div class="field field--inline"><label class="label" for="u-status">สถานะ</label><select class="select" id="u-status" data-jcrm-change="u-filter-status"><option value="ALL">ทั้งหมด</option>' + stOpts + "</select></div>" +
      (hasFilter ? ui.button({ label: "ล้างตัวกรอง", variant: "ghost", action: "u-clear" }) : "") +
      '</div><p class="t-xs t-muted" style="margin:0 0 var(--space-3)">ค้นในรายการที่โหลดแล้วเท่านั้น (ไม่ใช่ช่องค้นหาลูกค้า · คำค้นไม่ลง URL) · อีเมลของพนักงานแสดงเฉพาะผู้มีสิทธิ์ดูรายชื่อผู้ใช้</p>' +
      '<div class="card card--flush" id="u-users-host">' + usersTable() + "</div></div>";
  }

  /* ---- แท็บทีม ---- */
  function visibleTeams() {
    var top = JCRM.topScope("user.read");
    if (top === "ORGANIZATION") { return D.teams.slice(); }
    if (top === "TEAM") { return D.teams.filter(function (t) { return D.teamMembers.some(function (m) { return m.team === t.code && m.staff === me() && m.isLeader; }); }); }
    if (top === "BRANCH") { var bs = JCRM.scopeBranches("user.read", "BRANCH"); return D.teams.filter(function (t) { return bs.indexOf(t.branch) !== -1; }); }
    return [];
  }

  /* ------------------------------------------------------ เมนู ⋮ ต่อแถว */
  function closeMenus() {
    JCRM.$$("[data-u-menu-pop]").forEach(function (p) { p.remove(); });
    JCRM.$$('[data-u-menu][aria-expanded="true"]').forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
  }
  function openMenu(btn) {
    var code = btn.getAttribute("data-u-menu");
    var wasOpen = !!document.querySelector('[data-u-menu-pop="' + code + '"]');
    JCRM.$$("[data-jcrm-popover]").forEach(function (p) { p.remove(); });
    closeMenus();
    if (wasOpen) { return; }
    var s = JCRM.staff(code), acts = rowActions(s);
    var pop = document.createElement("div");
    pop.className = "popover menu-popover u-menu";
    pop.setAttribute("data-jcrm-popover", "");
    pop.setAttribute("data-u-menu-pop", code);
    pop.setAttribute("role", "menu");
    pop.setAttribute("aria-label", "การกระทำของ " + s.displayName);
    pop.innerHTML = acts.map(function (a) {
      var cls = "menu-item" + (a.key === "disable" ? " u-menu__danger" : "");
      return '<button type="button" role="menuitem" class="' + cls + '"' + (a.reason ? ' aria-disabled="true" data-tooltip="' + esc(a.reason) + '"' : ' data-jcrm-action="u-' + a.key + '" data-jcrm-id="' + esc(code) + '"') + "><span>" + esc(a.label) +
        (a.reason ? '<span class="menu-item__label-disabled">' + esc(a.reason) + "</span>" : "") + "</span></button>";
    }).join("");
    document.body.appendChild(pop);
    var r = btn.getBoundingClientRect();
    var top = r.bottom + 4;
    if (top + pop.offsetHeight > window.innerHeight - 8) { top = Math.max(8, r.top - pop.offsetHeight - 4); }
    pop.style.top = top + "px";
    pop.style.left = Math.max(8, r.right - pop.offsetWidth) + "px";
    btn.setAttribute("aria-expanded", "true");
    var items = JCRM.$$(".menu-item", pop);
    if (items[0]) { items[0].focus(); }
    pop.addEventListener("keydown", function (e) {
      var i = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
      if (e.key === "Escape" || e.key === "Tab") { closeMenus(); btn.focus(); }
    });
  }
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest("[data-u-menu]") : null;
    if (!b) { return; }
    e.preventDefault(); e.stopPropagation();
    openMenu(b);
  }, true);

      var list = draft.length ? draft.map(function (d, i) {
        return '<div class="u-member"><span>' + ui.avatar(JCRM.staffName(d.staff), "sm") + " " + esc(staffWithCode(d.staff)) + (d.isLeader ? " " + ui.badge("หัวหน้า", "navy", "badge--square") : "") + "</span>" +
          '<span class="u-actions">' + ui.button({ label: d.isLeader ? "ยกเลิกหัวหน้า" : "ตั้งเป็นหัวหน้า", variant: "secondary", size: "sm", action: "tm-leader", id: String(i) }) +
          ui.button({ label: "นำออก", variant: "danger-outline", size: "sm", action: "tm-remove", id: String(i) }) + "</span></div>";
      }).join("") : ui.state("empty", { title: "ไม่มีสมาชิก", compact: true });
      var opts = eligible();
      return '<div class="stack"><p class="t-sm">' + esc(t.name + " · " + JCRM.branchName(t.branch)) + "</p>" + list +
        '<div class="field"><label class="label" for="tm-add">+ เพิ่มสมาชิก</label><div class="input-group"><select class="select" id="tm-add"' + (opts.length ? "" : " disabled") + '><option value="">' + (opts.length ? "เลือกพนักงาน" : "ไม่มีพนักงานที่มีบทบาทในสาขานี้เพิ่มได้") + "</option>" +
        opts.map(function (s) { return '<option value="' + esc(s.staffCode) + '">' + esc(s.displayName + " · " + s.staffCode) + "</option>"; }).join("") + "</select>" +
        ui.button({ label: "เพิ่ม", variant: "secondary", action: "tm-add" }) + '</div><p class="help">พนักงานต้องมีบทบาทในสาขาของทีมก่อน</p></div>' +
        '<p class="t-xs t-warning">การตั้งหรือยกเลิกหัวหน้าทำให้บทบาทหัวหน้าทีมในสาขานี้มีผลหรือหมดผลทันที</p></div>';
    }
    function sync() {
      var host = ctl && ctl.el.querySelector("[data-tm-body]");
      if (host) { host.innerHTML = bodyHtml(); }
      var hid = ctl && ctl.el.querySelector('input[name="draft"]');
      if (hid) { hid.value = JSON.stringify(draft); }
    }
    JCRM.on("tm-leader", function (i) { var d = draft[Number(i)]; if (d) { d.isLeader = !d.isLeader; sync(); } });
    JCRM.on("tm-remove", function (i) { draft.splice(Number(i), 1); sync(); });
    JCRM.on("tm-add", function () {
      var sel = ctl && ctl.el.querySelector("#tm-add");
      if (!sel || !sel.value) { JCRM.toast("เลือกพนักงานก่อน", "warning"); return; }
      draft.push({ staff: sel.value, isLeader: false }); sync();
    });
    ctl = JCRM.drawer({
      title: "จัดการสมาชิกทีม", ref: t.code,
      body: '<div data-tm-body>' + bodyHtml() + "</div>",
      fields: [{ name: "draft", type: "hidden", value: JSON.stringify(draft) }],
      submitLabel: "บันทึก", submitVariant: "accent",
      onSubmit: function () {
        for (var i = D.teamMembers.length - 1; i >= 0; i--) { if (D.teamMembers[i].team === teamCode) { D.teamMembers.splice(i, 1); } }
        draft.forEach(function (d) { D.teamMembers.push({ team: teamCode, staff: d.staff, isLeader: d.isLeader }); });
        JCRM.toast("บันทึกสมาชิกทีม " + teamCode + " แล้ว (prototype) · ระบบจริงเรียก api.set_team_member", "success");
        rerender();
        return true;
      }
    });
  });

  /* --------------------------------------------------------- คำขอมอบบทบาท (ข้อ 7.2) */
  JCRM.on("rg-select", function (no) { selectedRequest = no; rerender(); });
  function applyDecision(q, status, note) {
    reqState[q.requestNo] = { status: status, decidedBy: me(), decidedAt: NOW, note: note || null };
    if (status === "APPROVED") {
      var t = JCRM.staff(q.target);
      if (t && q.type === "GRANT" && !t.assignments.some(function (a) { return a.role === q.role; })) { t.assignments.push({ role: q.role, branch: null }); }
      if (t && q.type === "REVOKE") { t.assignments = t.assignments.filter(function (a) { return a.role !== q.role; }); }
    }
  }
  JCRM.on("rg-approve", function (no) {
    var q = JCRM.find(allRequests(), "requestNo", no); if (!q || decisionReason(q)) { return; }
    JCRM.confirm({
      title: "อนุมัติคำขอ " + no + "?",
      message: JCRM.label("roleGrantType", q.type) + "บทบาท " + roleLabel(q.role) + " · " + staffWithCode(q.target) + (q.type === "GRANT" ? " · บทบาทมีผลเมื่อบัญชีเปิดใช้งาน" : ""),
      confirmLabel: "อนุมัติ", variant: "primary",
      onConfirm: function () {
        applyDecision(q, "APPROVED");
        JCRM.toast("อนุมัติ " + no + " แล้ว (prototype) · ระบบจริงเรียก api.decide_role_grant บันทึก ROLE_GRANT_DECIDED และแจ้งผู้ยื่น", "success");
        rerender();
        return true;
      }
    });
  });
  JCRM.on("rg-reject", function (no) {
    var q = JCRM.find(allRequests(), "requestNo", no); if (!q || decisionReason(q)) { return; }
    JCRM.dialog({
      title: "ปฏิเสธคำขอ " + no, size: "md",
      fields: [{ name: "note", label: "เหตุผล", type: "textarea", required: true, piiWarn: true, maxLength: 500, rows: 3 }],
      submitLabel: "ปฏิเสธคำขอ", submitVariant: "danger-outline",
      onSubmit: function (v) {
        applyDecision(q, "REJECTED", v.note);
        JCRM.toast("ปฏิเสธ " + no + " แล้ว (prototype) · ระบบจริงแจ้ง ROLE_GRANT_DECIDED ถึงผู้ยื่น", "success");
        rerender();
        return true;
      }
    });
  });
  JCRM.on("rg-new", function () {
    var roles = (JCRM.find(D.roleGrantRules, "actor", "SYSTEM_ADMIN") || {}).requestOnly || [];
    var grantTargets = D.staff.filter(function (s) { return s.status !== "DISABLED" && s.staffCode !== me(); });
    var revokeTargets = D.staff.filter(function (s) { return s.staffCode !== me() && s.assignments.some(function (a) { return HIGH_ROLES.indexOf(a.role) !== -1; }); });
    JCRM.dialog({
      title: "ยื่นคำขอบทบาท", size: "md",
      intro: '<p class="t-sm">คำขอรอผู้บริหารอนุมัติ · ระบบแจ้งผู้บริหารทุกคนยกเว้นผู้รับ · ลบคำขอไม่ได้ (ข้อ 7.2)</p>',
      fields: [
        { name: "type", label: "ชนิดคำขอ", type: "radio", required: true, inline: true, options: D.enums.roleGrantType.map(function (x) { return { value: x.code, label: x.labelTh }; }) },
        { name: "role", label: "บทบาท", type: "select", required: true, options: roles.map(function (r) { return { value: r, label: roleLabel(r) }; }) },
        { name: "target_grant", label: "ผู้รับ", type: "select", options: grantTargets.map(function (s) { return { value: s.staffCode, label: s.displayName + " · " + s.staffCode }; }),
          visibleWhen: { field: "type", equals: "GRANT" }, requiredWhen: { field: "type", equals: "GRANT" }, requiredMessage: "เลือกผู้รับ", help: "บัญชีที่ไม่ใช่ปิดใช้งาน" },
        { name: "target_revoke", label: "ผู้รับ", type: "select", options: revokeTargets.map(function (s) { return { value: s.staffCode, label: s.displayName + " · " + s.staffCode }; }),
          visibleWhen: { field: "type", equals: "REVOKE" }, requiredWhen: { field: "type", equals: "REVOKE" }, requiredMessage: "เลือกผู้รับ", help: "บัญชีที่ถือบทบาทนั้นอยู่" },
        { name: "reason", label: "เหตุผล", type: "textarea", required: true, piiWarn: true, maxLength: 500, rows: 2 }
      ],
      submitLabel: "ยื่นคำขอ", submitVariant: "primary",
      onSubmit: function (v) {
        var targetCode = v.type === "GRANT" ? v.target_grant : v.target_revoke, t = JCRM.staff(targetCode);
        var field = v.type === "GRANT" ? "target_grant" : "target_revoke";
        var err = null;
        if (!t) { err = "เลือกผู้รับ"; }
        else if (v.type === "GRANT" && v.role === "SYSTEM_ADMIN" && isBusiness(t)) { err = "บัญชีที่มีบทบาทธุรกิจรับบทบาทผู้ดูแลระบบ (IT) ไม่ได้"; }
        else if (v.type === "GRANT" && v.role !== "SYSTEM_ADMIN" && hasRole(t, "SYSTEM_ADMIN")) { err = "บัญชีผู้ดูแลระบบ (IT) รับบทบาทธุรกิจไม่ได้"; }
        else if (v.type === "GRANT" && hasRole(t, v.role)) { err = "บัญชีนี้มีบทบาทนี้อยู่แล้ว"; }
        else if (v.type === "REVOKE" && !hasRole(t, v.role)) { err = "บัญชีนี้ไม่มีบทบาทนี้"; }
        else if (allRequests().some(function (q) { return q.status === "REQUESTED" && q.target === targetCode && q.role === v.role && q.type === v.type; })) { err = "มีคำขอนี้รออนุมัติอยู่แล้ว"; }
        if (err) { var e = {}; e[field] = err; return { errors: e }; }
        var no = nextRequestNo();
        localRequests.push({ requestNo: no, type: v.type, role: v.role, target: targetCode, requestedBy: me(), requestedAt: NOW, reason: v.reason, status: "REQUESTED" });
        selectedRequest = no;
        JCRM.toast("ยื่นคำขอ " + no + " แล้ว (prototype) · รอผู้บริหารอนุมัติ · ระบบจริงเรียก api.request_role_grant และแจ้ง ROLE_GRANT_APPROVAL_REQUIRED", "success");
        rerender();
        return true;
      }
    });
  });

  /* --------------------------------------------------------- อุปกรณ์ */
  JCRM.on("d-register", function () {
    var bs = JCRM.scopeBranches("user.update", "BRANCH");
    var fields = [{ name: "device_id", label: "รหัสอุปกรณ์", type: "static", html: '<p class="t-sm">' + DASH + ' <span class="t-muted">(device_id ของเครื่องนี้ · prototype ไม่สร้างรหัสจริง)</span></p>' }];
    if (bs.length === 1) {
      fields.push({ name: "branch_lock", label: "สาขา", type: "static", html: '<p class="t-sm">' + esc(JCRM.branchName(bs[0])) + ' <span class="t-muted">(ล็อก)</span></p>' });
      fields.push({ name: "branch", type: "hidden", value: bs[0] });
    } else {
      fields.push({ name: "branch", label: "สาขา", type: "select", required: true, options: bs.map(function (b) { return { value: b, label: JCRM.branchName(b) }; }) });
    }
    fields.push({ name: "shared", label: "อุปกรณ์ counter ใช้ร่วมกัน", type: "checkbox",
      help: "เครื่องนี้จะล็อกหน้าจอเมื่อไม่มีการใช้งาน " + fmt.int(D.settingValues["session.shared_counter_idle_min"]) + " นาที และซ่อน ‘จดจำฉันไว้’" });
    JCRM.dialog({
      title: "ลงทะเบียนเครื่องนี้", size: "md", fields: fields, cancelLabel: "ยกเลิก", submitLabel: "บันทึก", submitVariant: "accent",
      onSubmit: function (v) {
        devices.push({ deviceId: DASH, branch: v.branch, shared: !!v.shared });
        if (v.shared) { document.documentElement.setAttribute("data-device", "counter"); }
        JCRM.toast("ลงทะเบียนอุปกรณ์แล้ว (prototype) · ระบบจริงเรียก api.register_device", "success");
        rerender();
        return true;
      }
    });
  });

  JCRM.page({ id: "users", render: render, branchPicker: false });
})();
</script>
</body>
</html>
